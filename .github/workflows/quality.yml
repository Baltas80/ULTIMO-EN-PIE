name: Project Quality

on:
  push:
    branches:
      - master
      - 'feat/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  structure:
    name: Validate project structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            project.godot
            scenes/main.tscn
            scenes/player.tscn
            scenes/bot.tscn
            scenes/hazard.tscn
            scripts/main.gd
            scripts/player.gd
            scripts/bot.gd
            scripts/hazard.gd
            docs/GDD-MVP.md
            docs/TECH-PLAN.md
            docs/ROADMAP-7-DIAS.md
            docs/VALIDATION-CHECKLIST.md
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Check Godot project configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^config_version=5$' project.godot
          grep -q '^run/main_scene="res://scenes/main.tscn"$' project.godot
          grep -q 'config/features=PackedStringArray("4.7"' project.godot
          test -f scenes/main.tscn

      - name: Validate res:// references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          references = []
          patterns = [
              re.compile(r'path="(res://[^"\n]+)"'),
              re.compile(r'preload\("(res://[^"\n]+)"\)'),
          ]

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix not in {'.tscn', '.gd'}:
                  continue
              text = path.read_text(encoding='utf-8')
              for pattern in patterns:
                  references.extend((path, match.group(1)) for match in pattern.finditer(text))

          missing = []
          for source, reference in references:
              target = root / reference.removeprefix('res://')
              if not target.is_file():
                  missing.append(f'{source}: {reference}')

          if missing:
              print('Broken res:// references:')
              print('\n'.join(missing))
              raise SystemExit(1)

          print(f'Validated {len(references)} res:// file references.')
          PY

      - name: Validate MVP invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const TOTAL_PARTICIPANTS := 50' scripts/main.gd
          grep -q '_spawn_bots(TOTAL_PARTICIPANTS - 1)' scripts/main.gd
          grep -q 'func register_elimination' scripts/main.gd
          grep -q 'func _show_result_screen' scripts/main.gd
          grep -q 'func _restart_match' scripts/main.gd
          grep -q 'cycle_speed_step' scripts/hazard.gd

      - name: Detect accidental large generated files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -not -path './.git/*' -size +10M -print -quit | grep -q .; then
            echo "A tracked project file exceeds 10 MB. Review before merging."
            exit 1
          fi

  godot:
    name: Validate with Godot 4.7.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Godot 4.7.2 headless editor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request

          api = 'https://api.github.com/repos/godotengine/godot-builds/releases/tags/4.7.2-stable'
          with urllib.request.urlopen(api) as response:
              release = json.load(response)

          assets = release['assets']
          matches = [
              asset for asset in assets
              if 'linux_headless.64.zip' in asset['name']
          ]
          if len(matches) != 1:
              raise SystemExit(f'Expected one Linux headless asset, found {len(matches)}')

          asset = matches[0]
          print(asset['browser_download_url'])
          with open('godot-download-url.txt', 'w', encoding='utf-8') as handle:
              handle.write(asset['browser_download_url'])
          PY
          curl --fail --location --retry 3 "$(cat godot-download-url.txt)" --output godot.zip
          unzip -q godot.zip
          GODOT_BIN="$(find . -maxdepth 2 -type f -name 'Godot_v4.7.2-stable_linux_headless.64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Parse all GDScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking $script"
            "$GODOT_BIN" --headless --path . --check-only --script "$script"
          done < <(find scripts -type f -name '*.gd' -print0 | sort -z)

      - name: Load project and main scene
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --quit

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          "$GODOT_BIN" --headless --path . --quit-after 120 2>&1 | tee godot-runtime.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 0
          if grep -E 'SCRIPT ERROR|Parse Error' godot-runtime.log; then
            echo 'Godot runtime smoke test reported a script error.'
            exit 1
          fi
